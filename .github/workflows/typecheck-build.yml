name: Typecheck & Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ts-check

  detect-native-changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      native-changed: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
              - 'app.json'
              - 'app.config.*'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - 'expo-env.d.ts'
              - '*.podspec'

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [typecheck, detect-native-changes]
    if: >-
      needs.detect-native-changes.outputs.native-changed == 'true'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx expo prebuild --platform android --clean

      - name: Build Android Release
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4096m -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.workers.max=2

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [typecheck, detect-native-changes]
    if: >-
      needs.detect-native-changes.outputs.native-changed == 'true'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS for Simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace SignumMobileWallet.xcworkspace \
            -scheme SignumMobileWallet \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
