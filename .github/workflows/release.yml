name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.exists == 'false' }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract changelog for this version
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(sed -n "/^## ${VERSION}/,/^## /p" CHANGELOG.md | sed '1d;$d' | head -100)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          # Write to file for the release body
          echo "$NOTES" > /tmp/release-notes.md
          # Append user-facing notes
          if [ -f "store/release-notes/en-US.txt" ]; then
            echo "" >> /tmp/release-notes.md
            echo "### What's new (user-facing)" >> /tmp/release-notes.md
            cat "store/release-notes/en-US.txt" >> /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md

  build-submit-android:
    name: Build & Submit to Play Store
    needs: tag-release
    if: needs.tag-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json', 'app.config.*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB
        run: eas build --local --platform android --profile production --non-interactive --output ./app-release.aab

      - name: Submit to Play Store
        run: eas submit --platform android --profile production --path ./app-release.aab --non-interactive

      - name: Upload AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.tag-release.outputs.tag }}" ./app-release.aab

  build-submit-ios:
    name: Build & Submit to App Store
    needs: tag-release
    if: needs.tag-release.outputs.new_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        run: eas build --local --platform ios --profile production --non-interactive --output ./app-release.ipa

      - name: Submit to App Store
        run: eas submit --platform ios --profile production --path ./app-release.ipa --non-interactive

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.tag-release.outputs.tag }}" ./app-release.ipa
